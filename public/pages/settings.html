<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | LaRestaurant</title>
    <link rel="stylesheet" href="../css/settings.css" />
  </head>
  <body>
    <main class="settings-page">
      <header class="settings-header">
        <div>
          <p class="eyebrow">Account</p>
          <h1>Settings</h1>
        </div>
        <a class="back-link" href="../index.html">Back to home</a>
      </header>

      <section class="settings-panel" aria-labelledby="profile-heading">
        <div class="panel-heading">
          <h2 id="profile-heading">Profile</h2>
          <p>Update the name shown on your account.</p>
        </div>

        <section class="avatar-section" aria-labelledby="avatar-heading">
          <h3 id="avatar-heading">Profile photo</h3>
          <div class="avatar-controls">
            <img
              id="avatarPreview"
              class="avatar-preview"
              src="https://cdn-icons-png.flaticon.com/128/1077/1077063.png"
              alt="Profile photo preview"
            />
            <div class="avatar-actions">
              <label class="file-button" for="avatarInput">Choose image</label>
              <input id="avatarInput" type="file" accept="image/*" />
              <div class="avatar-buttons">
                <button id="saveAvatarButton" type="button" disabled>
                  Save photo
                </button>
                <button
                  id="removeAvatarButton"
                  class="secondary-button"
                  type="button"
                >
                  Remove photo
                </button>
              </div>
            </div>
          </div>
          <p id="avatarMessage" class="settings-message" aria-live="polite"></p>
        </section>

        <form id="settingsForm">
          <label for="settingsName">Name</label>
          <input id="settingsName" name="name" type="text" required />

          <label for="settingsEmail">Email</label>
          <input id="settingsEmail" name="email" type="email" readonly />

          <button type="submit">Save changes</button>
          <p
            id="settingsMessage"
            class="settings-message"
            aria-live="polite"
          ></p>
        </form>
      </section>
    </main>
    <script src="../js/settings.js"></script>
  </body>
</html>
