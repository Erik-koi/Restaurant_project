<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Table | LaRestaurant</title>
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/book-table.css" />
  </head>
  <body>
    <div class="top-right">
      <a href="../index.html" class="icon-btn" aria-label="Back to home">
        <img
          src="https://cdn-icons-png.flaticon.com/128/25/25694.png"
          alt="Home"
        />
      </a>
    </div>

    <h1>Book a Table</h1>

    <section class="table-summary" aria-label="Location details">
      <div class="summary-item">
        <span>Location</span>
        <strong>Metropolia Leiritie</strong>
      </div>
      <div class="summary-item">
        <span>Available for selected time</span>
        <strong id="availableCount">7 / 7</strong>
      </div>
    </section>

    <main class="tables-page">
      <div class="reservation-controls">
        <label for="reservationStart">
          Reservation date and time
          <input id="reservationStart" type="datetime-local" required />
        </label>
      </div>

      <p id="reservationMessage" class="reservation-message" aria-live="polite"></p>
      <a id="loginPrompt" class="login-prompt" href="login.html?redirect=book-table.html" hidden>
        Log in to reserve a table
      </a>
      <section id="tableList" class="table-list" aria-label="Available tables"></section>
    </main>
    <script src="../js/booking.js"></script>
  </body>
</html>
