<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Table | LaRestaurant</title>
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/book-table.css" />
  </head>
  <body>
    <div class="top-right">
      <a href="../index.html" class="icon-btn" aria-label="Back to home">
        <img
          src="https://cdn-icons-png.flaticon.com/128/25/25694.png"
          alt="Home"
        />
      </a>
    </div>

    <h1>Book a Table</h1>

    <section class="table-summary" aria-label="Location details">
      <div class="summary-item">
        <span>Location</span>
        <strong>Metropolia Leiritie</strong>
      </div>
      <div class="summary-item">
        <span>Total tables</span>
        <strong>7</strong>
      </div>
    </section>

    <main class="tables-page">
      <section class="table-list" aria-label="Tables at Metropolia Leiritie">
        <article class="table-card">
          <span class="table-number">01</span>
          <p>Table 01</p>
        </article>
        <article class="table-card">
          <span class="table-number">02</span>
          <p>Table 02</p>
        </article>
        <article class="table-card">
          <span class="table-number">03</span>
          <p>Table 03</p>
        </article>
        <article class="table-card">
          <span class="table-number">04</span>
          <p>Table 04</p>
        </article>
        <article class="table-card">
          <span class="table-number">05</span>
          <p>Table 05</p>
        </article>
        <article class="table-card">
          <span class="table-number">06</span>
          <p>Table 06</p>
        </article>
        <article class="table-card">
          <span class="table-number">07</span>
          <p>Table 07</p>
        </article>
      </section>
    </main>
  </body>
</html>
